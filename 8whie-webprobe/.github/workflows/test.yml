name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [ '1.21.x', '1.22.x', '1.23.x' ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Verify code formatting
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted according to gofmt. Run 'gofmt -w -s .'"
            exit 1
          fi

      - name: Run Go vet static analysis
        run: go vet ./...

      - name: Execute unit & integration test suite
        run: go test -v -race ./tests/...

      - name: Build CLI executable
        run: go build -v ./cmd/webprobe
