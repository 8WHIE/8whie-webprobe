name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Multi-Architecture Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Distribution Binaries
        run: |
          mkdir -p dist
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/webprobe-linux-amd64 ./cmd/webprobe
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/webprobe-linux-arm64 ./cmd/webprobe
          # Android Termux (ARMv7)
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/webprobe-termux-armv7 ./cmd/webprobe
          # macOS Intel & Apple Silicon
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/webprobe-darwin-amd64 ./cmd/webprobe
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/webprobe-darwin-arm64 ./cmd/webprobe
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/webprobe-windows-amd64.exe ./cmd/webprobe

          # Generate SHA256 checksums
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
